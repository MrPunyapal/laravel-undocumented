    var DATA = {"categories":[{"icon":"📊","name":"Eloquent","slug":"eloquent","color":"bg-blue-100 text-blue-700"}],"features":[{"name":"withAggregate()","path":"features\/eloquent\/withAggregate.md","categorySlug":"eloquent","categoryName":"Eloquent","categoryIcon":"📊","description":"Fetch a single column from a relationship as a subselect without loading the full model","html":"\u003Cp\u003E\u003Cstrong\u003EDescription:\u003C\/strong\u003E Adds a subselect to the query that fetches a single column from a related model without eager loading the full relationship. The value is accessible as a dynamically named attribute (\u003Ccode\u003E{relation}_{column}\u003C\/code\u003E) on the result.\u003C\/p\u003E\n\u003Cp\u003EThis is the underlying method that powers \u003Ccode\u003EwithCount()\u003C\/code\u003E, \u003Ccode\u003EwithSum()\u003C\/code\u003E, \u003Ccode\u003EwithMax()\u003C\/code\u003E, \u003Ccode\u003EwithMin()\u003C\/code\u003E, \u003Ccode\u003EwithAvg()\u003C\/code\u003E, and \u003Ccode\u003EwithExists()\u003C\/code\u003E.\u003C\/p\u003E\n\u003Ch2\u003ESignature\u003C\/h2\u003E\n\u003Cpre\u003E\u003Ccode class=\"language-php\"\u003EwithAggregate(mixed $relations, string $column, string $function = null): static\n\u003C\/code\u003E\u003C\/pre\u003E\n\u003Ch2\u003EUsage\u003C\/h2\u003E\n\u003Cpre\u003E\u003Ccode class=\"language-php\"\u003Euse App\\Models\\Post;\n\n$posts = Post::query()\n    \/\/ You maybe already know:\n    -&gt;withCount('comments')     \/\/ adds comments_count\n    -&gt;withSum('comments', 'votes') \/\/ adds comments_sum_votes\n\n    \/\/ You might not know this — fetch a single relationship column\n    \/\/ without loading the full model or running extra queries.\n    \/\/ Works great for one-to-one \/ belongsTo relationships.\n    -&gt;withAggregate('user', 'name')  \/\/ adds user_name\n\n    -&gt;get();\n\necho $posts-&gt;first()-&gt;user_name; \/\/ &quot;John Doe&quot;\n\u003C\/code\u003E\u003C\/pre\u003E\n\u003Ch2\u003EHow it works\u003C\/h2\u003E\n\u003Cp\u003E\u003Ccode\u003EwithAggregate()\u003C\/code\u003E adds a correlated subquery to the main SQL query. For example, \u003Ccode\u003EwithAggregate('user', 'name')\u003C\/code\u003E produces something like:\u003C\/p\u003E\n\u003Cpre\u003E\u003Ccode class=\"language-sql\"\u003ESELECT\n    posts.*,\n    (\n        SELECT users.name\n        FROM users\n        WHERE users.id = posts.user_id\n        LIMIT 1\n    ) AS user_name\nFROM posts\n\u003C\/code\u003E\u003C\/pre\u003E\n\u003Ch2\u003ENotes\u003C\/h2\u003E\n\u003Cul\u003E\n\u003Cli\u003EThe generated attribute name follows the pattern \u003Ccode\u003E{snake_case_relation}_{column}\u003C\/code\u003E.\u003C\/li\u003E\n\u003Cli\u003EFor aggregate functions pass the \u003Ccode\u003E$function\u003C\/code\u003E argument (e.g. \u003Ccode\u003E'SUM'\u003C\/code\u003E, \u003Ccode\u003E'MAX'\u003C\/code\u003E). When \u003Ccode\u003Enull\u003C\/code\u003E, it selects the raw column value.\u003C\/li\u003E\n\u003Cli\u003EAll the familiar helper methods (\u003Ccode\u003EwithCount\u003C\/code\u003E, \u003Ccode\u003EwithSum\u003C\/code\u003E, \u003Ccode\u003EwithMax\u003C\/code\u003E, \u003Ccode\u003EwithMin\u003C\/code\u003E, \u003Ccode\u003EwithAvg\u003C\/code\u003E, \u003Ccode\u003EwithExists\u003C\/code\u003E) delegate to this single method internally.\u003C\/li\u003E\n\u003C\/ul\u003E\n\u003Ch2\u003ESource\u003C\/h2\u003E\n\u003Cp\u003E\u003Ccode\u003EIlluminate\\Database\\Eloquent\\Concerns\\QueriesRelationships::withAggregate()\u003C\/code\u003E\u003C\/p\u003E\n\u003Chr \/\u003E\n"}]};

    // ─── Sidebar nav ──────────────────────────────────────────────────────

    function renderNav() {
      var nav     = document.getElementById('sidebar-nav');
      var empty   = document.getElementById('nav-empty');
      var q       = searchQuery.toLowerCase();
      var html    = '';
      var anyHit  = false;

      DATA.categories.forEach(function(cat) {
        var items = grouped[cat.slug].filter(function(f) {
          return !q
            || f.name.toLowerCase().indexOf(q) !== -1
            || f.description.toLowerCase().indexOf(q) !== -1;
        });
        if (!items.length) return;
        anyHit = true;

        html += '<div class="mb-3">';
        html += '<div class="px-4 pt-3 pb-1 text-[10px] font-semibold text-gray-400 uppercase tracking-widest select-none">'
              + cat.icon + '&nbsp;' + esc(cat.name) + '</div>';
        items.forEach(function(f) {
          var isActive = activeFeature && activeFeature.name === f.name;
          html += '<button class="nav-item' + (isActive ? ' active' : '') + ' w-full text-left px-4 py-2 text-sm text-gray-700 flex items-center gap-2" data-name="' + esc(f.name) + '">'
                + '<span class="truncate">' + esc(f.name) + '</span>'
                + '</button>';
        });

          var feature = DATA.features.find(function(f) { return f.name === name; });
          if (feature) showFeature(feature);
        });
      });
    }

      document.getElementById('content-title').textContent = feature.name;
      document.getElementById('content-desc').textContent  = feature.description;

      body.innerHTML = feature.html;
      body.querySelectorAll('pre code').forEach(function(b) { hljs.highlightElement(b); });

      document.getElementById('content-wrap').classList.remove('hidden');

    var mobBackdrop = document.getElementById('mob-backdrop');

      sidebar.classList.remove('open');
      mobBackdrop.classList.remove('open');
      document.body.style.overflow = '';
    }

      var isOpen = sidebar.classList.toggle('open');
      mobBackdrop.classList.toggle('open', isOpen);
      document.body.style.overflow = isOpen ? 'hidden' : '';
    });

    mobBackdrop.addEventListener('click', closeMobileSidebar);

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeMobileSidebar();
